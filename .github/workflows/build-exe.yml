name: Build DocControl exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements_v2.0.txt
      - name: Build exe
        run: >
          pyinstaller --onefile --console --name DocControl_v2.0
          --collect-all extract_msg --collect-all fpdf
          DocControl_v2.0.py
      - name: Smoke test (no emails present)
        run: |
          mkdir smoke
          copy dist\DocControl_v2.0.exe smoke\
          smoke\DocControl_v2.0.exe --nopause
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: DocControl_v2.0-exe
          path: dist/DocControl_v2.0.exe
