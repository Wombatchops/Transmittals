name: Outlook add-in - build and publish

on:
  push:
    branches: [main]
    paths: ["outlook-addin/**", ".github/workflows/addin-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outlook-addin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          DC_CLIENT_ID: ${{ vars.DC_CLIENT_ID }}
        run: npm run build
      - name: Validate manifest (Microsoft service)
        continue-on-error: true
        run: npx --yes office-addin-manifest validate dist/DocControl_manifest_v*.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outlook-addin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
